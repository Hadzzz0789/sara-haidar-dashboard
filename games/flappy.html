<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Flappy Bird</title>

<style>

body {
    margin: 0;
    text-align: center;
    font-family: Arial;
    background: #071524;
    color: white;
}

nav {
    text-align: left;
    padding: 20px;
}

nav a {
    color: #5ef4ff;
    text-decoration: none;
}

canvas {
    border: 3px solid white;
    border-radius: 12px;
    max-width: 95vw;
}

h1 {
    color: #ffd83d;
}

button {
    padding: 12px 25px;
    border: 0;
    border-radius: 8px;
    background: #ffd83d;
    font-weight: bold;
    cursor: pointer;
}

</style>

</head>

<body>

<nav>
<a href="../index.html">← Back to Arcade</a>
</nav>

<h1>🐤 FLAPPY</h1>

<p>
Score: <span id="score">0</span>
|
Best: <span id="best">0</span>
</p>

<canvas
id="game"
width="420"
height="600">
</canvas>

<p>
SPACE / CLICK to flap
</p>

<button onclick="resetGame()">
Restart
</button>

<script src="../js/flappy.js"></script>

</body>
</html>
