<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Runner · S&H
    </title>

    <link
        rel="stylesheet"
        href="../css/game.css"
    >

</head>

<body>

<nav class="nav">

    <a href="../index.html">
        ← Dashboard
    </a>

    <div class="logo">
        S&H ARCADE
    </div>

</nav>

<main class="shell">

    <h1>🦖 Runner</h1>

    <p class="sub">
        Jump. Run. Survive.
    </p>

    <div class="bar">

        <div class="pill">
            <small>DISTANCE</small>
            <b id="score">0</b>
        </div>

        <div class="pill">
            <small>BEST</small>
            <b id="best">0</b>
        </div>

    </div>

    <canvas
        id="game"
        width="800"
        height="500">
    </canvas>

    <div
        id="help"
        class="help">
    </div>

    <button onclick="location.reload()">
        Restart
    </button>

</main>

<script>
    window.GAME = "runner";
</script>

<script src="../js/arcade.js"></script>

</body>
</html>
