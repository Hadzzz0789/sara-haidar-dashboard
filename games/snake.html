<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake | Sara's & Haidar's Arcade</title>

    <link rel="stylesheet" href="../css/game.css">
</head>

<body>

<nav class="game-nav">
    <a href="../index.html">← Back to Arcade</a>

    <div class="game-brand">
        S&H ARCADE
    </div>
</nav>

<main class="game-shell">

    <div class="game-heading">
        <div class="game-icon">🐍</div>

        <div>
            <p class="eyebrow">SARA'S & HAIDAR'S ARCADE</p>
            <h1>Snake</h1>
            <p class="subtitle">Eat. Grow. Survive.</p>
        </div>
    </div>

    <div class="game-stats">

        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>HIGH SCORE</span>
            <strong id="best">0</strong>
        </div>

    </div>

    <div class="canvas-wrapper">

        <canvas
            id="game"
            width="800"
            height="500">
        </canvas>

    </div>

    <div class="game-controls">

        <p id="help">
            Arrow Keys / WASD
        </p>

        <button
            class="restart-btn"
            onclick="location.reload()">
            ↻ Restart Game
        </button>

    </div>

</main>

<script src="../js/arcade.js"></script>

</body>
</html>
